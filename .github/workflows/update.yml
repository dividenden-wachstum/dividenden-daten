name: Update Dividend Data

on:
  schedule:
    # Läuft jeden Tag um 02:00 Uhr nachts (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Erlaubt es, das Skript jederzeit auch manuell per Button auf GitHub zu starten

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Schreibrechte, um die aktualisierte json-Datei zu speichern

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: yfinance installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Skript ausführen
        run: python generate_champions.py

      - name: Änderungen speichern & pushen
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add champions.json
          git diff-index --quiet HEAD || git commit -m "Auto-Update Dividenden-Daten"
          git push
